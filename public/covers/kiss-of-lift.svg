<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A workout tracker card for hip thrusts: weekly load bars rising with progressive overload, one lighter deload week, and a quick-version button"
  style="--card-a:#333030;--card-b:#1b1717;--ink:#f4f0ee;--soft:#a39b98;--bar:#27cace;--peak:#dff747;--deload:#85e6ea;--cta:#e3106a;--link:#dff747">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--card-a)"/><stop offset="1" stop-color="var(--card-b)"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect x="130" y="90" width="540" height="820" rx="56" fill="url(#card)" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" filter="url(#sh)"/>
  <text x="190" y="190" font-family="Georgia,serif" font-size="44" fill="var(--ink)">This week</text>
  <text x="190" y="236" font-family="sans-serif" font-size="22" fill="var(--soft)">Hip thrust · 4 sets</text>
  <rect x="190" y="560" width="64" height="120" rx="12" fill="var(--bar)"/>
  <rect x="276" y="520" width="64" height="160" rx="12" fill="var(--bar)"/>
  <rect x="362" y="470" width="64" height="210" rx="12" fill="var(--bar)"/>
  <rect x="448" y="420" width="64" height="260" rx="12" fill="var(--peak)"/>
  <rect x="534" y="570" width="64" height="110" rx="12" fill="none" stroke="var(--deload)" stroke-width="2.5" stroke-dasharray="7 7"/>
  <line x1="190" y1="680" x2="598" y2="680" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <text x="190" y="716" font-family="sans-serif" font-size="18" fill="var(--soft)">Wk 1</text>
  <text x="448" y="716" font-family="sans-serif" font-size="18" fill="var(--soft)">Wk 4</text>
  <text x="534" y="716" font-family="sans-serif" font-size="18" fill="var(--soft)">Deload</text>
  <rect x="190" y="770" width="420" height="68" rx="34" fill="var(--cta)"/>
  <text x="400" y="813" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#fff">Start workout</text>
  <text x="400" y="880" text-anchor="middle" font-family="sans-serif" font-size="20" fill="var(--link)" text-decoration="underline">Short on time? Quick version</text>
</svg>
