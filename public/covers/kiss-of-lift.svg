<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" style="--ink:#1d2622;--card:#fafaf7;--soft:#5b6660;--bar:#c5cde0" role="img" aria-label="A workout tracker card for hip thrusts: weekly load bars rising with progressive overload, one lighter deload week, and a quick-version button">
  <g fill="none" stroke="var(--ink)" stroke-width="2">
    <rect x="130" y="90" width="540" height="820" rx="56" fill="var(--card)" stroke-opacity=".16"/>
  </g>
  <text x="190" y="190" font-family="Georgia,serif" font-size="44" fill="var(--ink)">This week</text>
  <text x="190" y="236" font-family="sans-serif" font-size="22" fill="var(--soft)">Hip thrust · 4 sets</text>
  <g>
    <rect x="190" y="560" width="64" height="120" rx="12" fill="var(--bar)"/>
    <rect x="276" y="520" width="64" height="160" rx="12" fill="var(--bar)"/>
    <rect x="362" y="470" width="64" height="210" rx="12" fill="var(--bar)"/>
    <rect x="448" y="420" width="64" height="260" rx="12" fill="var(--ink)"/>
    <rect x="534" y="570" width="64" height="110" rx="12" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="7 7"/>
  </g>
  <line x1="190" y1="680" x2="598" y2="680" stroke="var(--ink)" stroke-opacity=".2" stroke-width="2"/>
  <text x="190" y="716" font-family="sans-serif" font-size="18" fill="var(--soft)">Wk 1</text>
  <text x="448" y="716" font-family="sans-serif" font-size="18" fill="var(--soft)">Wk 4</text>
  <text x="534" y="716" font-family="sans-serif" font-size="18" fill="var(--soft)">Deload</text>
  <rect x="190" y="770" width="420" height="68" rx="34" fill="var(--ink)"/>
  <text x="400" y="813" text-anchor="middle" font-family="sans-serif" font-size="24" fill="var(--card)">Start workout</text>
  <rect x="190" y="854" width="420" height="0" />
  <text x="400" y="880" text-anchor="middle" font-family="sans-serif" font-size="20" fill="var(--soft)" text-decoration="underline">Short on time? Quick version</text>
</svg>
